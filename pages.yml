name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar arquivos publicados
        run: |
          mkdir _site
          cp index.html app.js styles.css supabase-config.js _site/
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
